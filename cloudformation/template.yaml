AWSTemplateFormatVersion: '2010-09-09'
Description: 'EventSquid API - Single API Gateway with dev and v1 stages, one Lambda'

Parameters:
  VpcId:
    Type: String
    Description: VPC ID where the Lambda will run

  SubnetIds:
    Type: CommaDelimitedList
    Description: Comma-separated list of subnet IDs for the Lambda VPC config

  ErrorNotificationEmail:
    Type: String
    Default: ''
    Description: Email address to receive error notifications (optional, leave empty to skip email subscription)

Conditions:
  HasEmail: !Not [!Equals [!Ref ErrorNotificationEmail, '']]

Resources:
  # IAM Role for Lambda
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: eventsquid-private-api-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:mongodb/*'
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:primary-mssql/*'
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/eventsquid-private-api:*'
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apigateway/eventsquid-private-api:*'

  # Use existing security groups from working Lambda
  # sg-277a3b5e (default/redis) and sg-d087f8ac (SquidSQL/SQUID App Servers)
  # These security groups already have proper egress rules configured
  # Note: VPC endpoints for Secrets Manager and CloudWatch Logs already exist in the VPC

  # Lambda Function (single function for all stages; pipeline updates code)
  LambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: eventsquid-private-api
      Runtime: nodejs24.x
      Handler: src/handler.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          exports.handler = async (event) => {
            return {
              statusCode: 200,
              body: JSON.stringify({ 
                message: 'Placeholder - deploy actual code via pipeline',
                note: 'See README.md for deployment instructions'
              })
            };
          };
      Timeout: 60
      MemorySize: 1024  # Increased for production: supports VPC, multiple DB connections, and large codebase
      Environment:
        Variables:
          NODE_ENV: dev
          ERROR_SNS_TOPIC_ARN: !Ref ErrorNotificationTopic
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds:
          - sg-277a3b5e  # Use existing security group from working Lambda
          - sg-d087f8ac   # Use existing security group from working Lambda
      ReservedConcurrentExecutions: 10

  # API Gateway - HTTP API (public access via route authorization)
  # Note: CORS is handled by Lambda, not API Gateway, to ensure headers are always present
  ApiGatewayRestApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: eventsquid-private-api
      ProtocolType: HTTP
      Description: EventSquid API Gateway

  # API Gateway Integration (uses function ARN; pipeline creates alias 'live' after deploy)
  ApiGatewayIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ApiGatewayRestApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub
        - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
        - LambdaArn: !GetAtt LambdaFunction.Arn
      PayloadFormatVersion: '2.0'

  # API Gateway Route - Catch all
  # AuthorizationType: NONE allows public access (no authentication required)
  # Note: OPTIONS requests are handled automatically by API Gateway CORS configuration
  # Do NOT create explicit OPTIONS routes - let API Gateway handle them
  ApiGatewayRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGatewayRestApi
      RouteKey: '$default'
      AuthorizationType: NONE
      Target: !Sub 'integrations/${ApiGatewayIntegration}'

  # API Gateway Stage: dev
  ApiGatewayStageDev:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ApiGatewayRestApi
      StageName: dev
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50

  # API Gateway Stage: v1
  ApiGatewayStageV1:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ApiGatewayRestApi
      StageName: v1
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50

  # Lambda Permission for API Gateway
  LambdaApiGatewayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LambdaFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayRestApi}/*/*'

  # Note: Lambda creates /aws/lambda/eventsquid-private-api automatically. Set retention in Console or: aws logs put-retention-policy --log-group-name /aws/lambda/eventsquid-private-api --retention-in-days 14

  # SNS Topic for Error Notifications
  ErrorNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: eventsquid-private-api-errors
      DisplayName: EventSquid Private API Errors

  # Email Subscription (optional - only if email is provided)
  ErrorNotificationSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasEmail
    Properties:
      TopicArn: !Ref ErrorNotificationTopic
      Protocol: email
      Endpoint: !Ref ErrorNotificationEmail

  # IAM Policy for Lambda to publish to SNS
  LambdaSNSPublishPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: LambdaSNSPublishPolicy
      Roles:
        - !Ref LambdaExecutionRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - sns:Publish
            Resource: !Ref ErrorNotificationTopic


Outputs:
  ApiGatewayUrlDev:
    Description: API Gateway URL (dev stage)
    Value: !Sub 'https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/dev'
    Export:
      Name: eventsquid-private-api-url-dev

  ApiGatewayUrlV1:
    Description: API Gateway URL (v1 stage)
    Value: !Sub 'https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/v1'
    Export:
      Name: eventsquid-private-api-url-v1

  LambdaFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt LambdaFunction.Arn
    Export:
      Name: eventsquid-private-api-lambda-arn

  LambdaFunctionName:
    Description: Lambda function name
    Value: !Ref LambdaFunction
    Export:
      Name: eventsquid-private-api-lambda-name

  ErrorNotificationTopicArn:
    Description: SNS Topic ARN for error notifications
    Value: !Ref ErrorNotificationTopic
    Export:
      Name: eventsquid-private-api-error-topic-arn


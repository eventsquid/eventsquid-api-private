AWSTemplateFormatVersion: '2010-09-09'
Description: 'EventSquid API - Single API Gateway with dev and v1 stages, one Lambda'

Parameters:
  VpcId:
    Type: String
    Description: VPC ID where the Lambda will run

  SubnetIds:
    Type: CommaDelimitedList
    Description: Comma-separated list of subnet IDs for the Lambda VPC config

  ErrorNotificationEmail:
    Type: String
    Default: ''
    Description: Email address to receive error notifications (optional, leave empty to skip email subscription)

Conditions:
  HasEmail: !Not [!Equals [!Ref ErrorNotificationEmail, '']]

Resources:
  # IAM Role for Lambda
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: eventsquid-private-api-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:mongodb/*'
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:primary-mssql/*'
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:timezonedb/*'
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:sendgrid/*'
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:twilio/*'
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/eventsquid-private-api:*'
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apigateway/eventsquid-private-api:*'
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                  - s3:GetObjectVersion
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::eventsquid'
                  - !Sub 'arn:aws:s3:::eventsquid/*'
                  - !Sub 'arn:aws:s3:::eventsquid-private'
                  - !Sub 'arn:aws:s3:::eventsquid-private/*'

  # Use existing security groups from working Lambda
  # sg-277a3b5e (default/redis) and sg-d087f8ac (SquidSQL/SQUID App Servers)
  # These security groups already have proper egress rules configured
  # Note: VPC endpoints for Secrets Manager and CloudWatch Logs already exist in the VPC

  # Lambda Function (single function for all stages; pipeline updates code)
  # NOTE: log group retention is NOT managed here. The AWS::Logs::LogGroup resource has
  # a known race between CreateLogGroup and PutRetentionPolicy that intermittently fails
  # ("specified log group does not exist") when something else is active on the group.
  # Retention is set instead by a post-deploy `aws logs put-retention-policy` step in
  # cloudformation/pipeline.yaml — idempotent and immune to the race.
  LambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: eventsquid-private-api
      Runtime: nodejs24.x
      Handler: src/handler.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          exports.handler = async (event) => {
            return {
              statusCode: 200,
              body: JSON.stringify({ 
                message: 'Placeholder - deploy actual code via pipeline',
                note: 'See README.md for deployment instructions'
              })
            };
          };
      Timeout: 300
      MemorySize: 1024  # Increased for production: supports VPC, multiple DB connections, and large codebase
      Environment:
        Variables:
          NODE_ENV: dev
          ERROR_SNS_TOPIC_ARN: !Ref ErrorNotificationTopic
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds:
          - sg-277a3b5e  # Use existing security group from working Lambda
          - sg-d087f8ac   # Use existing security group from working Lambda
      ReservedConcurrentExecutions: 1000  # Sized for registration spikes of 600-1000 concurrent users. Account quota L-B99A9384 = 5000, so this leaves 4000 unreserved for other Lambdas.

  # Lambda alias dev -> $LATEST (develop branch). Alias "live" is created/updated by pipeline on main.
  LambdaAliasDev:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: !Ref LambdaFunction
      FunctionVersion: $LATEST
      Name: dev

  # REST API with stage variables: dev -> :dev ($LATEST), v1 -> :live (published version)
  ApiGatewayRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: eventsquid-private-api
      Description: EventSquid API Gateway (REST API for stage-based Lambda aliases)

  ApiGatewayResourceProxy:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ParentId: !GetAtt ApiGatewayRestApi.RootResourceId
      PathPart: '{proxy+}'

  ApiGatewayMethodRoot:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ResourceId: !GetAtt ApiGatewayRestApi.RootResourceId
      HttpMethod: ANY
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:eventsquid-private-api:${!stageVariables.lambdaAlias}/invocations'
          - {}

  ApiGatewayMethodProxy:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ResourceId: !Ref ApiGatewayResourceProxy
      HttpMethod: ANY
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:eventsquid-private-api:${!stageVariables.lambdaAlias}/invocations'
          - {}

  ApiGatewayDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ApiGatewayMethodRoot
      - ApiGatewayMethodProxy
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      Description: Deployment for dev and v1 stages

  ApiGatewayStageDev:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      DeploymentId: !Ref ApiGatewayDeployment
      StageName: dev
      Variables:
        lambdaAlias: dev
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingBurstLimit: 100
          ThrottlingRateLimit: 50

  ApiGatewayStageV1:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      DeploymentId: !Ref ApiGatewayDeployment
      StageName: v1
      Variables:
        lambdaAlias: live
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingBurstLimit: 100
          ThrottlingRateLimit: 50

  # Lambda permissions for API Gateway (required per alias when using stage variables)
  LambdaApiGatewayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LambdaFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayRestApi}/*/*'

  # Permission for dev stage (invokes alias :dev)
  LambdaApiGatewayPermissionDev:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LambdaAliasDev
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayRestApi}/*/*'

  # Permission for v1 stage (invokes alias :live – pipeline creates this alias)
  LambdaApiGatewayPermissionLive:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Sub
        - '${LambdaName}:live'
        - LambdaName: !Ref LambdaFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayRestApi}/*/*'

  # SNS Topic for Error Notifications
  ErrorNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: eventsquid-private-api-errors
      DisplayName: EventSquid Private API Errors

  # Email Subscription (optional - only if email is provided)
  ErrorNotificationSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasEmail
    Properties:
      TopicArn: !Ref ErrorNotificationTopic
      Protocol: email
      Endpoint: !Ref ErrorNotificationEmail

  # IAM Policy for Lambda to publish to SNS
  LambdaSNSPublishPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: LambdaSNSPublishPolicy
      Roles:
        - !Ref LambdaExecutionRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - sns:Publish
            Resource: !Ref ErrorNotificationTopic


Outputs:
  ApiGatewayUrlDev:
    Description: API Gateway URL (dev stage)
    Value: !Sub 'https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/dev'
    Export:
      Name: eventsquid-private-api-url-dev

  ApiGatewayUrlV1:
    Description: API Gateway URL (v1 stage)
    Value: !Sub 'https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/v1'
    Export:
      Name: eventsquid-private-api-url-v1

  LambdaFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt LambdaFunction.Arn
    Export:
      Name: eventsquid-private-api-lambda-arn

  LambdaFunctionName:
    Description: Lambda function name
    Value: !Ref LambdaFunction
    Export:
      Name: eventsquid-private-api-lambda-name

  ErrorNotificationTopicArn:
    Description: SNS Topic ARN for error notifications
    Value: !Ref ErrorNotificationTopic
    Export:
      Name: eventsquid-private-api-error-topic-arn


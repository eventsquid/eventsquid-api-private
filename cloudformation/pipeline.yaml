AWSTemplateFormatVersion: '2010-09-09'
Description: 'Pipeline for eventsquid-api-private Lambda deployment'

Parameters:
  GitHubOwner:
    Type: String
    Description: GitHub repository owner
  
  GitHubRepo:
    Type: String
    Description: GitHub repository name
    Default: eventsquid-api-private
  
  GitHubBranch:
    Type: String
    Description: GitHub branch name
    Default: main

  DeploymentEnvironment:
    Type: String
    Description: Deployment stage name (e.g. dev, v1)
    Default: dev

  VpcId:
    Type: String
    Description: VPC ID where the Lambda will run

  SubnetIds:
    Type: String
    Description: Comma-separated list of subnet IDs for the Lambda VPC config

  GitHubConnectionArn:
    Type: String
    Description: ARN of the GitHub connection from AWS Connector
  

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldArtifacts
            Status: Enabled
            ExpirationInDays: 30

  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCloudFormationFullAccess
        - arn:aws:iam::aws:policy/AWSLambda_FullAccess
      Policies:
        - PolicyName: CodeBuildServiceRolePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Resource:
                  - !Sub arn:aws:s3:::${ArtifactBucket}/*
                  - !Sub arn:aws:s3:::${ArtifactBucket}
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:GetObjectVersion
                  - s3:PutObjectAcl
                  - s3:ListBucket
              - Effect: Allow
                Resource: '*'
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DeleteLogGroup
                  - logs:DescribeLogGroups
              - Effect: Allow
                Resource: '*'
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:PassRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:GetRolePolicy
              - Effect: Allow
                Resource: '*'
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
              - Effect: Allow
                Resource: '*'
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DeleteNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeVpcs
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
              - Effect: Allow
                Resource: '*'
                Action:
                  - sns:CreateTopic
                  - sns:DeleteTopic
                  - sns:GetTopicAttributes
                  - sns:SetTopicAttributes
                  - sns:Subscribe
                  - sns:Unsubscribe
                  - sns:ListSubscriptionsByTopic
                  - sns:TagResource
                  - sns:UntagResource
              - Effect: Allow
                Resource: '*'
                Action:
                  - apigateway:*
                  - execute-api:*

  CodePipelineServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodePipelineServiceRolePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Resource:
                  - !Sub arn:aws:s3:::${ArtifactBucket}/*
                  - !Sub arn:aws:s3:::${ArtifactBucket}
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:GetObjectVersion
                  - s3:PutObjectAcl
                  - s3:ListBucket
              - Effect: Allow
                Resource: '*'
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                  - codebuild:BatchGetProjects
                  - codestar-connections:UseConnection

  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${AWS::StackName}-build
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: ARTIFACT_BUCKET
            Value: !Ref ArtifactBucket
            Type: PLAINTEXT
          - Name: AWS_REGION
            Value: us-west-2
            Type: PLAINTEXT
          - Name: DEPLOY_ENV
            Value: !Ref DeploymentEnvironment
            Type: PLAINTEXT
          - Name: VPC_ID
            Value: !Ref VpcId
            Type: PLAINTEXT
          - Name: SUBNET_IDS
            Value: !Ref SubnetIds
            Type: PLAINTEXT
      Source:
        Type: CODEPIPELINE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              runtime-versions:
                nodejs: 24
              commands:
                - npm ci
            build:
              commands:
                - npm install --production
                # Pre-deploy import check: load the Lambda handler against the production-only
                # dep tree that's about to ship. Catches SyntaxError, missing exports, and
                # missing-module errors BEFORE any zip or AWS resource update. An unhandled
                # rejection here makes the build exit non-zero, aborting the deploy.
                - node --input-type=module -e "import('./src/handler.js').then(() => { console.log('✓ Import check passed'); }).catch(err => { console.error('✗ Import check FAILED:', err.message); if (err.stack) console.error(err.stack.split('\n').slice(0, 5).join('\n')); process.exit(1); });"
                - zip -r function.zip . -x '*.git*' -x '*.zip' -x 'node_modules/.cache/*' -x '*.md' -x '.github/*' -x 'cloudformation/*' -x '*.test.js' -x '.eslintrc*'
                - |
                  if [ -z "$VPC_ID" ] || [ -z "$SUBNET_IDS" ]; then
                    echo "ERROR: VPC_ID and SUBNET_IDS must be set. Update the pipeline stack with VpcId and SubnetIds parameters."
                    echo "Redeploy pipeline: aws cloudformation deploy --template-file cloudformation/pipeline.yaml --stack-name <pipeline-stack-name> --parameter-overrides file://pipeline-params.json --capabilities CAPABILITY_NAMED_IAM"
                    exit 1
                  fi
                - aws cloudformation deploy --template-file cloudformation/template.yaml --stack-name eventsquid-private-api --parameter-overrides VpcId=${VPC_ID} SubnetIds=${SUBNET_IDS} --capabilities CAPABILITY_NAMED_IAM --region ${AWS_REGION}
                # Set Lambda log retention to 30 days. Done here instead of in the CFN template because
                # AWS::Logs::LogGroup has a Create+PutRetention race that intermittently fails. Both
                # commands are idempotent: create-log-group no-ops if it exists; put-retention-policy
                # overwrites without error.
                - aws logs create-log-group --log-group-name /aws/lambda/eventsquid-private-api --region ${AWS_REGION} || true
                - aws logs put-retention-policy --log-group-name /aws/lambda/eventsquid-private-api --retention-in-days 30 --region ${AWS_REGION}
                - aws lambda update-function-code --function-name eventsquid-private-api --zip-file fileb://function.zip --region ${AWS_REGION}
                - aws lambda wait function-updated --function-name eventsquid-private-api --region ${AWS_REGION}
                - aws lambda update-function-configuration --function-name eventsquid-private-api --environment Variables="{NODE_ENV=${DEPLOY_ENV}}" --region ${AWS_REGION}
                - aws lambda wait function-updated --function-name eventsquid-private-api --region ${AWS_REGION}
                - |
                  if [ "$DEPLOY_ENV" = "prod" ]; then
                    VERSION=$(aws lambda publish-version --function-name eventsquid-private-api --region ${AWS_REGION} --query 'Version' --output text)
                    aws lambda update-alias --function-name eventsquid-private-api --name live --function-version $VERSION --region ${AWS_REGION} || aws lambda create-alias --function-name eventsquid-private-api --name live --function-version $VERSION --region ${AWS_REGION}
                    # Pre-warm 10 containers on the live alias to eliminate cold starts on routine traffic.
                    # Provisioned concurrency persists across alias updates; put-config enforces the desired state every deploy.
                    aws lambda put-provisioned-concurrency-config --function-name eventsquid-private-api --qualifier live --provisioned-concurrent-executions 10 --region ${AWS_REGION}
                  fi
          artifacts:
            files: '**/*'

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub ${AWS::StackName}-pipeline
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Version: 1
                Provider: CodeStarSourceConnection
              Configuration:
                ConnectionArn: !Ref GitHubConnectionArn
                FullRepositoryId: !Sub ${GitHubOwner}/${GitHubRepo}
                BranchName: !Ref GitHubBranch
              OutputArtifacts:
                - Name: SourceCode
        - Name: Build
          Actions:
            - Name: Build
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              Configuration:
                ProjectName: !Ref BuildProject
              InputArtifacts:
                - Name: SourceCode
              OutputArtifacts:
                - Name: BuildOutput

Outputs:
  PipelineURL:
    Description: CodePipeline URL
    Value: !Sub https://console.aws.amazon.com/codepipeline/home?region=${AWS::Region}#/view/${Pipeline}
  PipelineName:
    Description: CodePipeline Name
    Value: !Ref Pipeline
  ArtifactBucketName:
    Description: S3 Bucket for artifacts
    Value: !Ref ArtifactBucket
  BuildProjectName:
    Description: CodeBuild Project Name
    Value: !Ref BuildProject

